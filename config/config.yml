web_socket:
  url: ws://127.0.0.1:8080/ws
  token:
  auto_reconnect: false

agent:
  num: 5
  team: kanolab
  kill_on_timeout: true

llm:
  type: google
  sleep_time: 10

openai:
  model: gpt-4o-mini
  temperature: 0.7

google:
  model: gemma-3-4b-it
  temperature: 0.7

ollama:
  model: llama3.1
  temperature: 0.7
  base_url: http://localhost:11434

contradiction_check:
  enabled: true
  target_requests:
    - talk
    - whisper
  history_limit: 10
  apply_revision: true
  fail_on_unresolved: false
  allow_role_bluff_roles:
    - WEREWOLF
    - POSSESSED


prompt:
  initialize: |-
    あなたは人狼ゲームのエージェントです。
    あなたの名前は{{ info.agent }}です。
    あなたの役職は{{ role.value }}です。
    これからゲームを進行します。
    あなたは「論理的な人狼ゲームのプレイヤー」として振る舞ってください。
    会話の主な目的は「誰が人狼か推理すること」および「他のプレイヤーを説得すること」です。

    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "自己紹介の方針や、このゲームでの立ち回りの計画",
      "action": "実際にゲーム内で発言する自己紹介の内容"
    }
    ```
    ※レスポンスの `action` の内容がゲーム内に送信されます。

  daily_initialize: |-
    昼開始リクエスト
    {{ info.day }}日目
    {% if info.medium_result is not none -%}
    霊能結果: {{ info.medium_result }}
    {%- endif %}
    {% if info.divine_result is not none -%}
    占い結果: {{ info.divine_result }}
    {%- endif %}
    {% if info.executed_agent is not none -%}
    追放結果: {{ info.executed_agent }}
    {%- endif %}
    {% if info.attacked_agent is not none -%}
    襲撃結果: {{ info.attacked_agent }}
    {%- endif %}
    {% if info.vote_list is not none -%}
    投票結果: {{ info.vote_list }}
    {%- endif %}

    【議論のルール】
    - もし誰かが「占い師」と名乗り出て、まだ「誰を占ったか（結果）」を言っていない場合は、最優先で「結果は誰ですか？」と質問してください。
    
    状況を整理し、今日の行動方針を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "昨夜の結果に対する考察と今日の方針",
      "action": "確認しました"
    }
    ```

  whisper: |-
    囁きリクエスト（人狼同士の会話）
    履歴:
    {% for w in whisper_history[sent_whisper_count:] -%}
    {{ w.agent }}: {{ w.text }}
    {% endfor %}

    思考の連鎖（CoT）を用いて発言を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "仲間の人狼との連携や襲撃方針についての思考",
      "action": "実際に囁く内容（50文字以内）または 'Over'"
    }
    ```

  prompt:
  # ------------------------------------------------------------------
  # daily_initialize: 朝イチの状況整理
  # ------------------------------------------------------------------
  daily_initialize: |-
    {{ info.day }}日目が始まりました。
    
    === 昨夜の出来事確認 ===
    {% if info.day == 1 %}
    【重要確認】
    - 昨夜（0日目の夜）は「占い」のみ行われました。
    - **「襲撃」はまだ発生していません。** 誰かが死んでいるとすれば、それは突然死です。
    - もしあなたが占い師（SEER）なら、手元に最初の占い結果があるはずです。
    {% elif info.day >= 2 %}
    - 昨夜（{{ info.day|int - 1 }}日目の夜）から「襲撃」が発生しています。
    - 犠牲者が誰か確認してください。
    {% endif %}

    === 現在の情報 ===
    生存者数: {{ info.alive_agents|length }}
    {% if info.medium_result is not none -%}
    霊能結果: {{ info.medium_result }}
    {%- endif %}
    {% if info.divine_result is not none -%}
    占い結果: {{ info.divine_result }}
    {%- endif %}
    {% if info.executed_agent is not none -%}
    昨日の処刑: {{ info.executed_agent }}
    {%- endif %}
    {% if info.attacked_agent is not none -%}
    昨夜の襲撃: {{ info.attacked_agent }}
    {%- endif %}

    今日の行動方針を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "時系列（今日は何日目で、昨夜何が起きたか）を踏まえた思考",
      "action": "確認しました"
    }
    ```

  # ------------------------------------------------------------------
  # talk: 会話生成プロンプト（0日目制御と文脈理解を強化）
  # ------------------------------------------------------------------
  talk: |-
    トークリクエスト

    === 基本情報 ===
    現在: {{ info.day }}日目
    あなたの名前: {{ info.agent }}
    あなたの役職: {{ role.value }}
    （発言用名称: SEER→占い師, WEREWOLF→人狼, POSSESSED→狂人, VILLAGER→村人）
    
    === ステータス ===
    生存者数: {{ info.alive_agents|length }}
    生存者:
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' -%}
    - {{ k }}
    {% endif -%}
    {%- endfor %}

    === あなたの記憶（直近の自分の発言） ===
    {% set my_talks = [] %}
    {% for w in talk_history %}
      {% if w.agent == info.agent %}
        {% set _ = my_talks.append(w.text) %}
      {% endif %}
    {% endfor %}
    {% if my_talks %}
    直近の発言: "{{ my_talks[-1] }}"
    (今日の総発言回数: {{ my_talks|length }})
    {% else %}
    (今日はまだ一度も発言していません)
    {% endif %}

    === 直前の会話履歴（最新3件） ===
    {% for w in talk_history[-3:] -%}
    {{ w.agent }}: {{ w.text }}
    {% endfor %}
    =========================

    === 役職別指示 ===

    {% if role.value == "SEER" -%}
    あなたは本物の「占い師」です。
    占い結果: {{ info.divine_result }}
    【行動ルール】
    1. 初回報告: 1日目以降、今日まだ自分の結果を言っていないなら、最優先で結果を伝えてください。
    2. 重複禁止: すでに結果を報告済み（上記「あなたの記憶」を参照）なら、二度同じ報告をしないでください。
       - 報告が済んでいるなら、「考察」や「投票相談」に話題を移してください。
       - ただし、誰かに「結果は何でしたか？」と聞かれた場合のみ、再送してください。
    {%- endif %}

    {% if role.value == "WEREWOLF" -%}
    あなたは「人狼」です。市民のふりをしながら、巧みに人間を追放へ誘導してください。
    【人狼の戦術ガイド】
    - 潜伏: 基本は「村人」として振る舞います。占い師だと嘘をつく必要はありません（狂人に任せるのが無難）。
    - ターゲット選定: 「寡黙な人」や「発言が曖昧な人」を見つけ、その人を疑う理由を述べ、処刑の流れを作ってください。
    - 同調: 他のプレイヤーが誰かを疑い始めたら、「確かにその点は怪しいですね」と同調し、信頼を勝ち取りつつ票を誘導してください。
    - 嘘の考察: 「[人間]の言動が怪しい、人狼かもしれない」と、もっともらしい嘘の推理を展開してください。
    {%- endif %}

    {% if role.value == "POSSESSED" -%}
    あなたは「狂人」です。人狼が勝てばあなたの勝利です。
    - 場を混乱させるために、嘘の「占い師CO」をして、適当な結果（人間を黒、または人狼を白）を伝えてください。
    {%- endif %}

    === 共通指示 ===
    現在は「{{ info.day }}日目」です。
    
    【思考プロセス（thought）での必須チェック】
    1. 重複チェック: 私は直前の発言で同じことを言いませんでしたか？（「あなたの記憶」を確認）
    2. 進捗管理: 自分の役職としての義務（COなど）は果たしましたか？果たしているなら、次のステップ（議論・投票先の提案）に進んでください。
    3. 文脈: 直前の発言は自分への質問ですか？質問なら回答を、そうでなければ自分の意見を述べてください。

    {% if info.day == 0 %}
    【0日目ルール】
    - 挨拶、自己紹介のみ。ゲームの話（役職COや推理）は厳禁。
    {% else %}
    【{{ info.day }}日目の方針】
    - 議論を停滞させないでください。同じ報告を繰り返すBotにならないこと。
    - 自分の意見（「私は[名前]が怪しいと思う」「今日は[名前]に投票したい」）を明確に述べてください。
    {% endif %}

    出力は以下のJSON形式のみ。
    ```json
    {
      "thought": "重複チェックと今日の戦略（誰を疑い、誰を守るか）",
      "action": "発言内容（同じ内容の連呼は禁止）"
    }
    ```

    あなたの回答:

  divine: |-
    占いリクエスト
    対象リスト:
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' -%}
    - {{ k }}
    {% endif -%}
    {%- endfor %}

    指示:
    上記「対象リスト」の中から、占いたいエージェントの名前を1人選んでください。
    重要: 必ずリストに表示されている「名前」をそのまま出力してください。
    （例: リストに「アスカ」とある場合、「Agent[01]」ではなく「アスカ」と出力すること）

    思考の連鎖（CoT）を用いて占い先を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "誰を占うべきかの推理と理由",
      "action": "アスカ"
    }
    ```

  guard: |-
    護衛リクエスト
    対象リスト:
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' -%}
    - {{ k }}
    {% endif -%}
    {%- endfor %}

    指示:
    上記「対象リスト」の中から、護衛したいエージェントの名前を1人選んでください。
    重要: 必ずリストに表示されている「名前」をそのまま出力してください。
    （例: リストに「アスカ」とある場合、「Agent[01]」ではなく「アスカ」と出力すること）

    思考の連鎖（CoT）を用いて護衛先を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "誰を護衛すべきかの推理と理由",
      "action": "アスカ"
    }
    ```

  vote: |-
    投票リクエスト
    対象リスト:
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' -%}
    - {{ k }}
    {% endif -%}
    {%- endfor %}

    指示:
    上記「対象リスト」の中から、追放（投票）したいエージェントの名前を1人選んでください。
    重要: 必ずリストに表示されている「名前」をそのまま出力してください。
    （例: リストに「アスカ」とある場合、「Agent[01]」ではなく「アスカ」と出力すること）

    思考の連鎖（CoT）を用いて投票先を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "誰を追放すべきかの推理と理由",
      "action": "アスカ"
    }
    ```

attack: |-
    襲撃リクエスト
    以下の中から襲撃対象を選び、その「エージェントID」のみを出力してください。
    （例: kanolab1）

    対象リスト:
    {% for k, v in info.status_map.items() -%}
    {%- if v == 'ALIVE' and k != info.agent -%}
    ID: {{ k }}
    {% endif -%}
    {%- endfor %}

    指示:
    上記「対象リスト」の中から、襲撃したいエージェントの名前を1人選んでください。
    重要: 必ずリストに表示されている「名前」をそのまま出力してください。
    （例: リストに「アスカ」とある場合、「Agent[01]」ではなく「アスカ」と出力すること）

    思考の連鎖（CoT）を用いて襲撃先を決定してください。
    出力は以下のJSON形式のみで行ってください。
    ```json
    {
      "thought": "誰を襲撃するのが最も有利か、占い師の可能性などの推理",
      "action": "アスカ"
    }
    ```

log:
  console_output: false
  file_output: true
  conversation_output: true
  conversation_all_output: true
  conversation_all_filename: conversation_all.txt
  output_dir: ./log
  level: INFO

  request:
    name: false
    initialize: false
    daily_initialize: false
    whisper: true
    talk: true
    daily_finish: false
    divine: true
    guard: true
  vote: true
  attack: true
  finish: false

module_prompt:
  initialize: |-
    あなたは人狼ゲームのエージェントです。
    あなたの名前は {{ info.agent }} です。
    あなたの役職は {{ role.value }} です。

    これから人狼ゲームを開始します。
    まず簡単な自己紹介と初日の方針を述べてください。

    出力形式：
    ```json
    {
      "self_introduction": "",
      "opening_policy": "",
      "message_to_others": ""
    }
    ```
  daily_initialize: |-
    あなたは {{ info.agent }}、役職 {{ role.value }} です。

    {{ info.day }} 日目が始まりました。
    生存プレイヤー: {{ info.alive_agents }}
    直前の出来事:
    {{ info.latest_events }}

    今日の行動を考える準備として、状況を整理してください。

    出力形式：
    ```json
    {
      "situation_summary": "",
      "today_objective": "",
      "notes_for_myself": ""
    }
    ```
  analyze: |-
    === ゲーム情報 ===
    日数: {{ info.day }}
    生存: {{ info.alive_agents }}
    イベント:
    {{ info.structured_events }}

    === 発言（要約） ===
    {{ info.talk_summaries }}

    以下を JSON で出力：

    ```json
    {
      "suspicion_scores": {},
      "trust_scores": {},
      "player_explanations": {},
      "today_main_lynch_target": {
        "agent": "",
        "reason": ""
      },
      "today_never_lynch_candidates": []
    }
    ```
  decide_strategy: |-
    以下は直前の analysis 結果です：
    {{ info.last_analysis_json }}

    今日1日の戦略を JSON で出力してください：

    ```json
    {
      "talk_style": "",
      "main_attack_target": {
        "agent": "",
        "reason": ""
      },
      "sub_attack_targets": [],
      "protect_targets": [],
      "vote_plan": {
        "primary": "",
        "backup": ""
      },
      "today_talking_points": []
    }
    ```
  talk_from_strategy: |-
    戦略：
    {{ info.today_strategy_json }}

    この戦略に従い、1ターン分の発言だけ生成してください。
    日本語の文章のみ出力。
    重要：出力は必ず「50文字以内」に収めてください。簡潔さが最優先です。
  vote: |-
    戦略：
    {{ info.today_strategy_json }}

    今日の投票先を次の JSON 形式で返してください：

    ```json
    {
      "vote_target": "",
      "reason": ""
    }
    ```
  contradiction_check: |-
    あなたは人狼ゲームエージェントの矛盾検査官です。
    以下の情報を用いて、今回の発話案が過去の発言や役職・状況と矛盾していないか確認してください。

    - エージェント名: {{ agent_name }}
    - 役職: {{ role.value if role else "" }}
    - 対象リクエスト: {{ request }}
    - 現在の日数: {{ info.day if info else "不明" }}

    {% if allow_role_bluff %}
    注意: この役職はゲーム上のブラフ（例: 自分を市民と偽る発言）を許容されています。実際の役職と異なる自己申告だけでは矛盾とみなさないでください。
    {% endif %}

    --- 自分の過去の発言（最新{{ agent_history|length }}件） ---
    {% if agent_history %}
    {% for item in agent_history %}
    * {{ item.agent }}: {{ item.text }}
    {% endfor %}
    {% else %}
    * 過去発言なし
    {% endif %}

    --- 会話全体の抜粋（最新{{ recent_talks|length }}件） ---
    {% if recent_talks %}
    {% for item in recent_talks %}
    * {{ item.agent }}: {{ item.text }}
    {% endfor %}
    {% else %}
    * 履歴なし
    {% endif %}

    --- 新しい発言案 ---
    {{ candidate_response }}

    JSON形式で結果を出力してください。
    ```json
    {
      "is_contradiction": false,
      "explanation": "",
      "revised_response": ""
    }
    ```